# Garde la base des inscriptions active.
# Un projet Supabase gratuit est mis en pause après 7 jours sans activité :
# cette tâche lit une petite table technique (sans donnée personnelle) tous les 3 jours.
# Elle lit l'adresse et la clé publique dans config.js : rien à régler en plus.
name: Garder la base active

on:
  schedule:
    - cron: "17 6 */3 * *"   # tous les 3 jours, vers 8 h (heure de Paris)
  workflow_dispatch:          # bouton « Run workflow » pour la lancer à la main

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire config.js et interroger la base
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js || true)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js || true)
          case "$KEY" in sb_publishable_*|eyJ*) ;; *) KEY="";; esac
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js n'est pas encore rempli : rien à faire."
            exit 0
          fi
          AUTH=()
          case "$KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $KEY");; esac
          curl --fail --silent --show-error "$URL/rest/v1/activite?select=id" -H "apikey: $KEY" "${AUTH[@]}"
          echo
          echo "Base interrogée : elle reste active."
